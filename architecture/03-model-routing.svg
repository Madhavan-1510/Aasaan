<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396"><title>Model routing and fallbacks</title><rect width="760" height="396" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="380" y="20" text-anchor="middle" font-size="16" fill="#2C2C2A" font-weight="bold" font-family="'DejaVu Sans', Arial, sans-serif">Model routing and fallbacks</text><rect x="40" y="64" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="140.0" y="84.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A" font-family="'DejaVu Sans', Arial, sans-serif">Agent</text><text x="140.0" y="103.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="'DejaVu Sans', Arial, sans-serif">asks for a role, e.g. teacher</text><line x1="240" y1="80" x2="290" y2="80" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><path d="M 290 104 L 242 104" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="140" y="142" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="'DejaVu Sans', Arial, sans-serif">gets a validated reply</text><rect x="290" y="64" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="390.0" y="84.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A" font-family="'DejaVu Sans', Arial, sans-serif">Model router</text><text x="390.0" y="103.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="'DejaVu Sans', Arial, sans-serif">reads models.yaml</text><rect x="520" y="30" width="220" height="320" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><text x="534" y="52" text-anchor="start" font-size="12" fill="#2C2C2A" font-weight="bold" font-family="'DejaVu Sans', Arial, sans-serif">Every attempt is validated</text><line x1="490" y1="92" x2="540" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="540" y="64" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="630.0" y="84.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041" font-family="'DejaVu Sans', Arial, sans-serif">Primary model</text><text x="630.0" y="103.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="'DejaVu Sans', Arial, sans-serif">tried first</text><line x1="630" y1="120" x2="630" y2="164" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="642" y="148" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="'DejaVu Sans', Arial, sans-serif">on failure</text><rect x="540" y="164" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="630.0" y="184.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041" font-family="'DejaVu Sans', Arial, sans-serif">Fallback 1</text><text x="630.0" y="203.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="'DejaVu Sans', Arial, sans-serif">smaller or alternate model</text><line x1="630" y1="220" x2="630" y2="264" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="642" y="248" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="'DejaVu Sans', Arial, sans-serif">on failure</text><rect x="540" y="264" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="630.0" y="284.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A" font-family="'DejaVu Sans', Arial, sans-serif">Fallback 2</text><text x="630.0" y="303.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="'DejaVu Sans', Arial, sans-serif">cache, rules, text-only</text><rect x="290" y="264" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="390.0" y="284.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A" font-family="'DejaVu Sans', Arial, sans-serif">Event log</text><text x="390.0" y="303.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="'DejaVu Sans', Arial, sans-serif">model used, latency, fallback</text><line x1="520" y1="292" x2="492" y2="292" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="380" y="376" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="'DejaVu Sans', Arial, sans-serif">Failure = timeout, rate limit, malformed output or a failed check.</text></svg>