# Aasaan on a single small server: app + Caddy (automatic HTTPS) + nightly SQLite backup.
# Usage: cp .env.example .env  (fill it in), then:  docker compose up -d --build
# See DEPLOY.md for the exact steps.
services:
  app:
    build: .
    image: aasaan:latest
    container_name: aasaan-app
    restart: unless-stopped
    env_file: .env
    environment:
      AASAAN_DB: /app/data/aasaan.db
      AASAAN_UPLOADS: /app/data/uploads
    volumes:
      - aasaan-data:/app/data
    expose:
      - "8000"
    deploy:
      replicas: 1   # SQLite: exactly one app instance

  caddy:
    image: caddy:2
    container_name: aasaan-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      AASAAN_DOMAIN: ${AASAAN_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: alpine:3
    container_name: aasaan-backup
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - aasaan-data:/data:ro
      - ./backups:/backups
    # Runs once at start, then every 24 h. Uses SQLite's online backup, safe while the app is running.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          if [ -f /data/aasaan.db ]; then
            f=/backups/aasaan-$$(date +%Y-%m-%d).db
            sqlite3 /data/aasaan.db ".backup '$$f'" && echo "backup written: $$f"
            find /backups -name 'aasaan-*.db' -mtime +14 -delete
          fi
          sleep 86400
        done

volumes:
  aasaan-data:
  caddy-data:
  caddy-config:
